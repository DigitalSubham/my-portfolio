<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">BlurMe screen-sharing privacy extension preview</title>
  <desc id="desc">A browser window with sensitive rows blurred and the BlurMe toolbar for area, element, and full-screen blur.</desc>
  <defs>
    <filter id="blur" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#0f172a"/>
  <rect x="90" y="90" width="1020" height="620" rx="32" fill="#f8fafc"/>
  <text x="160" y="180" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0f172a">BlurMe</text>
  <text x="160" y="232" font-family="Arial, sans-serif" font-size="30" fill="#475569">Privacy for screen sharing</text>

  <rect x="160" y="280" width="600" height="370" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <rect x="160" y="280" width="600" height="52" rx="22" fill="#f1f5f9"/>
  <rect x="160" y="310" width="600" height="22" fill="#f1f5f9"/>
  <circle cx="195" cy="306" r="8" fill="#f87171"/>
  <circle cx="221" cy="306" r="8" fill="#fbbf24"/>
  <circle cx="247" cy="306" r="8" fill="#34d399"/>
  <text x="200" y="385" font-family="Arial, sans-serif" font-size="22" fill="#475569">Email</text>
  <text x="200" y="460" font-family="Arial, sans-serif" font-size="22" fill="#475569">Phone</text>
  <text x="200" y="535" font-family="Arial, sans-serif" font-size="22" fill="#475569">Card</text>
  <text x="200" y="610" font-family="Arial, sans-serif" font-size="22" fill="#475569">API key</text>
  <g filter="url(#blur)">
    <text x="330" y="387" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">priya.sharma@company.com</text>
    <text x="330" y="462" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">+91 98765 43210</text>
    <text x="330" y="537" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">4111 2222 3333 4444</text>
    <text x="330" y="612" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">sk-live-9f8a7b6c5d4e</text>
  </g>
  <rect x="318" y="356" width="400" height="44" rx="12" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="8 8"/>

  <rect x="810" y="280" width="230" height="370" rx="22" fill="#eef2ff"/>
  <text x="845" y="330" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#3730a3">Toolbar</text>
  <rect x="840" y="355" width="170" height="54" rx="14" fill="#4f46e5"/>
  <text x="925" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">Area blur</text>
  <rect x="840" y="425" width="170" height="54" rx="14" fill="#ffffff"/>
  <text x="925" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#3730a3">Element</text>
  <rect x="840" y="495" width="170" height="54" rx="14" fill="#ffffff"/>
  <text x="925" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#3730a3">Full screen</text>
  <rect x="840" y="565" width="170" height="54" rx="14" fill="#ffffff"/>
  <text x="925" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#3730a3">Hide tabs</text>
