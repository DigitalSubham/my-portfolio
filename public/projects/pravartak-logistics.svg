<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Pravartak Logistics portal preview</title>
  <desc id="desc">Freight quote card with a route, and the onboarding steps from quote to KYC to verified account.</desc>
  <rect width="1200" height="800" fill="#7c2d12"/>
  <rect x="90" y="90" width="1020" height="620" rx="32" fill="#f8fafc"/>
  <text x="160" y="180" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0f172a">Pravartak Logistics</text>
  <text x="160" y="232" font-family="Arial, sans-serif" font-size="30" fill="#475569">Quotes and customer onboarding</text>

  <rect x="160" y="280" width="470" height="250" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="215" cy="345" r="14" fill="#ea580c"/>
  <path d="M215 345c120 0 120 90 250 90" fill="none" stroke="#fdba74" stroke-width="8" stroke-dasharray="4 16" stroke-linecap="round"/>
  <circle cx="575" cy="435" r="14" fill="#0f172a"/>
  <text x="240" y="335" font-family="Arial, sans-serif" font-size="22" fill="#475569">Pune</text>
  <text x="470" y="478" font-family="Arial, sans-serif" font-size="22" fill="#475569">Kolkata</text>
  <text x="190" y="500" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">₹ 48,500</text>
  <rect x="160" y="560" width="225" height="62" rx="16" fill="#22c55e"/>
  <text x="272" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">WhatsApp</text>
  <rect x="405" y="560" width="225" height="62" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="517" y="600" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Email quote</text>

  <rect x="680" y="280" width="360" height="342" rx="24" fill="#fff7ed"/>
  <text x="715" y="332" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#9a3412">Onboarding</text>
  <path d="M735 380v170" stroke="#fed7aa" stroke-width="6"/>
  <circle cx="735" cy="380" r="20" fill="#ea580c"/>
  <path d="M726 380l6 7 12-14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="772" y="388" font-family="Arial, sans-serif" font-size="23" fill="#0f172a">Quote accepted</text>
  <circle cx="735" cy="465" r="20" fill="#ea580c"/>
  <path d="M726 465l6 7 12-14" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="772" y="473" font-family="Arial, sans-serif" font-size="23" fill="#0f172a">KYC documents</text>
  <circle cx="735" cy="550" r="20" fill="#ffffff" stroke="#ea580c" stroke-width="5"/>
  <text x="772" y="558" font-family="Arial, sans-serif" font-size="23" fill="#0f172a">Account verified</text>
</svg>
