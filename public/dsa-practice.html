<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>TRE DSA Question Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one 880px reading column; a topic ledger on the home view, one OMR-style question card in practice. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #e9edf2;
  --fg: #16202b;
  --muted: #586472;
  --line: #d6dce4;
  --ink: #2348c9;          /* ballpoint blue: what candidates fill OMR bubbles with */
  --ink-soft: #e4eafc;
  --omr: #c5527a;          /* OMR sheet print colour for bubble outlines */
  --ok: #1d7a4c;
  --ok-soft: #e1f3e9;
  --bad: #bf3528;
  --bad-soft: #fbe6e3;
  --warn: #9a6512;
  --warn-soft: #fbf0dc;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #171e27; --sunk: #1d2631; --fg: #e5eaf0; --muted: #9aa6b3; --line: #2b3542;
    --ink: #86a3ff; --ink-soft: #1f2b4d; --omr: #e07c9e;
    --ok: #52c58d; --ok-soft: #133325; --bad: #f07a6e; --bad-soft: #3a1b18; --warn: #e3b05c; --warn-soft: #3a2c13;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e27; --sunk: #1d2631; --fg: #e5eaf0; --muted: #9aa6b3; --line: #2b3542;
  --ink: #86a3ff; --ink-soft: #1f2b4d; --omr: #e07c9e;
  --ok: #52c58d; --ok-soft: #133325; --bad: #f07a6e; --bad-soft: #3a1b18; --warn: #e3b05c; --warn-soft: #3a2c13;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); }
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 88%; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 18px; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--omr); }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.link { background: none; border: 0; padding: 4px 0; color: var(--ink); cursor: pointer; font-weight: 500; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 20px; }
.top .brand { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.save { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.save::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.save[data-mode="account"]::before { background: var(--ok); }
.save[data-mode="browser"]::before { background: var(--warn); }
.save-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.save-controls .save { flex: 1 1 220px; overflow-wrap: anywhere; }
.save-controls .btn { flex-shrink: 0; }

/* summary */
.summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font: 700 26px/1.1 var(--f-display); font-stretch: 85%; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); }
@media (max-width: 620px) { .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

/* topic ledger */
.ledger { display: flex; flex-direction: column; gap: 12px; }
.ledger-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.topic { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; }
.topic.pyq { border-color: var(--omr); }
.t-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.t-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.t-meta { font-size: 13px; color: var(--muted); }
.bar { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .c { background: var(--ok); }
.bar .w { background: var(--bad); opacity: 0.75; }
.t-line { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.t-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.t-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.ready { background: var(--ok-soft); color: var(--ok); }
.chip.work { background: var(--warn-soft); color: var(--warn); }
.chip.low { background: var(--bad-soft); color: var(--bad); }
@media (max-width: 620px) {
  .topic { grid-template-columns: minmax(0, 1fr); }
  .t-side { align-items: flex-start; }
  .t-actions { justify-content: flex-start; }
}

/* setup panel */
.setup { grid-column: 1 / -1; border-top: 1px dashed var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.setup fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.setup legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 6px; width: 100%; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; background: var(--surface); }
.seg input:checked + label { border-color: var(--ink); background: var(--ink-soft); color: var(--ink); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: 2px; }
.setup .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.setup .hint { font-size: 13px; color: var(--muted); }

/* weak sub-topics */
.weak { display: flex; flex-direction: column; gap: 10px; }
.weak ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.weak li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.weak li:first-child { border-top: 0; }
.weak .w-name { min-width: 0; }
.weak .w-name small { display: block; color: var(--muted); font-size: 12px; }

/* notes */
.notes { border-top: 1px solid var(--line); padding-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 28px; font-size: 14px; color: var(--muted); }
.notes h3 { font-size: 15px; color: var(--fg); margin-bottom: 4px; }
.notes p + p { margin-top: 6px; }
@media (max-width: 620px) { .notes { grid-template-columns: minmax(0, 1fr); } }
.reset { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 14px; }

/* question view */
.qbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 2; }
.qbar .qtitle { font-weight: 600; min-width: 0; }
.qbar .right { display: flex; gap: 12px; align-items: center; }
.timer { font: 600 15px var(--f-mono); padding: 3px 10px; border-radius: 6px; background: var(--sunk); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.track { height: 4px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ink); }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--sunk); color: var(--muted); }
.qid { font: 500 12px var(--f-mono); color: var(--muted); margin-left: auto; }
.qtext { font-size: 17px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; }
.code { margin: 0; background: var(--sunk); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 14px/1.5 var(--f-mono); }
.omr { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.opt { width: 100%; display: flex; align-items: flex-start; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.opt:hover:not([disabled]) { border-color: var(--ink); }
.opt[disabled] { cursor: default; }
.bubble { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--omr); color: var(--omr); display: grid; place-items: center; font: 600 13px var(--f-mono); }
.otext { padding-top: 3px; overflow-wrap: anywhere; min-width: 0; }
.opt.picked .bubble { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.opt.picked { border-color: var(--ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .bubble { border-color: var(--ok); color: var(--ok); }
.opt.right.picked .bubble { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .bubble { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt .mark { margin-left: auto; font-size: 12px; font-weight: 600; padding-top: 4px; white-space: nowrap; }
.opt.right .mark { color: var(--ok); }
.opt.wrong .mark { color: var(--bad); }
.feedback { border-radius: 8px; padding: 12px 14px; background: var(--sunk); display: flex; flex-direction: column; gap: 6px; }
.verdict { font-weight: 600; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.exp { white-space: pre-wrap; overflow-wrap: anywhere; }
.qnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.qnav .left { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.keys { font-size: 13px; color: var(--muted); }
kbd { font: 500 12px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

/* results */
.result-head { display: flex; flex-direction: column; gap: 8px; }
.review { display: flex; flex-direction: column; gap: 8px; }
.review details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.review summary { cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; list-style: none; }
.review summary::-webkit-details-marker { display: none; }
.review summary .st { font: 600 12px var(--f-mono); flex: none; width: 58px; }
.review summary .st.ok { color: var(--ok); }
.review summary .st.bad { color: var(--bad); }
.review summary .st.skip { color: var(--muted); }
.review summary .qs { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review .body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.review .body .qtext { font-size: 15px; }
.review .body ol { margin: 0; padding-left: 22px; }
.review .body li.is-ans { color: var(--ok); font-weight: 600; }
.review .body li.is-pick { color: var(--bad); }
.teach { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: 14px; }
.teach h4 { margin: 0; font: 600 12px/1.2 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--omr); }
.teach .concept { font-size: 15.5px; line-height: 1.65; overflow-wrap: anywhere; }
.work { margin: 0; background: var(--sunk); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font: 13px/1.6 var(--f-mono); white-space: pre; }
.why { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.why li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
.why li.is-ans { border-color: var(--ok); background: var(--ok-soft); }
.why li.is-pick:not(.is-ans) { border-color: var(--bad); }
.why .wl { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--omr); color: var(--omr); display: grid; place-items: center; font: 600 13px var(--f-mono); }
.why li.is-ans .wl { border-color: var(--ok); background: var(--ok); color: var(--surface); }
.why .wo { font-weight: 600; overflow-wrap: anywhere; }
.why .wb { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-right: 6px; color: var(--muted); }
.why li.is-ans .wb { color: var(--ok); }
.why .wt { margin-top: 2px; overflow-wrap: anywhere; }
.tip { border-left: 3px solid var(--ink); padding: 6px 12px; background: var(--ink-soft); border-radius: 0 8px 8px 0; }
.empty { padding: 24px; text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .opt, .btn { transition: border-color .15s, background-color .15s; }
  .bar i, .track i { transition: width .3s ease; }
}
</style>

<div class="wrap" id="app" aria-live="polite"></div>

<script src="/dsa-practice.js" defer></script>

</body>
</html>
